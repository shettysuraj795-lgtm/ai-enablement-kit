- id: GQ-06
  persona: finance_analyst
  question: What was the take rate by dealer tier last quarter?
  kind: metric
  expected:
    classification: certified
    intent:
      metric: take_rate
      dimensions: [dealer_tier]
      filters: []
      time_grain: quarter
      time_range: {start: '2026-07-01', end: '2026-10-01', as_of: '2026-11-14', relative: last_quarter}
    reference_sql: |-
      SELECT date_trunc('quarter', order_date) AS period, dealer_tier,
             sum(commission_eur) / nullif(sum(gross_amount_eur), 0) AS take_rate
      FROM marts.fct_orders
      WHERE is_paid = TRUE AND order_date >= DATE '2026-07-01' AND order_date < DATE '2026-10-01'
      GROUP BY period, dealer_tier ORDER BY period, dealer_tier
    tolerance: 1.0e-06
    result:
      columns: [period, dealer_tier, take_rate]
      rows:
      - ['2026-07-01', platinum, '0.041622']
      - ['2026-07-01', premium, '0.050233']
      - ['2026-07-01', standard, '0.058679']

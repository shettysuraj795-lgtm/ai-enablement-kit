version: 2

seeds:
  - name: fx_rates
    description: >-
      Daily reference rates, written by `data/generate.py`. One row per
      calendar day and currency, including EUR at 1, so every order date has a
      rate.
    config:
      column_types:
        rate_date: date
        currency: varchar
        eur_per_unit: decimal(18, 6)
    columns:
      - name: eur_per_unit
        description: EUR per one unit of `currency`.
        data_tests: [not_null]

name: governed analytics

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/governed-analytics-mcp
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # GR-08 compares metric versions with the previous commit

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            examples/governed-analytics-mcp/data/requirements.txt
            examples/governed-analytics-mcp/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Generate synthetic data
        working-directory: examples/governed-analytics-mcp/data
        run: python generate.py

      - name: dbt build (seeds, models, tests)
        working-directory: examples/governed-analytics-mcp/dbt
        run: dbt build

      - name: Golden answers are up to date
        working-directory: examples/governed-analytics-mcp/data
        run: python golden_answers.py --check

      - name: Catalogue validation (GR-04, GR-08)
        env:
          PYTHONPATH: src
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python -m governed_analytics.validate --base "$BASE"
          else
            python -m governed_analytics.validate
          fi

      - name: Tests (compiler, periods, receipts, MCP server end to end)
        run: pytest -q

      - name: Golden evals through the MCP server (tool layer)
        env:
          PYTHONPATH: src
        run: python -m governed_analytics.evals
